<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 3 Pro 体验报告</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --primary-color: #4285f4; /* Google Blueish */
            --accent-good: #34a853;   /* Green */
            --accent-bad: #ea4335;    /* Red */
            --text-main: #202124;
            --text-sub: #5f6368;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 400px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, #4285f4, #34a853);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }

        .header p {
            margin: 10px 0 0;
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 25px;
        }

        .message-block {
            margin-bottom: 25px;
            padding: 15px;
            border-radius: 12px;
            border-left: 5px solid;
            background-color: #fafafa;
        }

        .good-news {
            border-color: var(--accent-good);
        }

        .bad-news {
            border-color: var(--accent-bad);
        }

        .tag {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
        }

        .tag.good { background-color: var(--accent-good); }
        .tag.bad { background-color: var(--accent-bad); }

        .title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
        }

        .description {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.5;
        }

        .comparison {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            text-align: center;
            position: relative;
        }

        .comparison::after {
            content: "VS";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #f0f2f5;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
            border: 2px solid white;
        }

        .side {
            flex: 1;
            padding: 10px;
        }

        .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        .label {
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }

        .sub-label {
            font-size: 12px;
            color: var(--text-sub);
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .cta-btn {
            display: inline-block;
            background-color: var(--text-main);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.2s;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
        }
        
        .highlight {
            font-weight: bold;
            color: var(--primary-color);
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Gemini 3 Pro</h1>
            <p>CLI 更新体验报告</p>
        </div>

        <div class="content">
            <!-- Good News -->
            <div class="message-block good-news">
                <span class="tag good">好消息</span>
                <span class="title">全面支持</span>
                <div class="description">
                    Gemini 3 Pro 现已正式接入 <strong>Gemini CLI</strong>！
                </div>
            </div>

            <!-- Bad News -->
            <div class="message-block bad-news">
                <span class="tag bad">坏消息</span>
                <span class="title">效果落差</span>
                <div class="description">
                    同样的提示词，前端生成效果与官方 <strong>AI Studio</strong> 相比差距明显。
                </div>
            </div>

            <!-- Visual Comparison -->
            <div class="comparison">
                <div class="side">
                    <span class="emoji">🌤️</span>
                    <span class="label">AI Studio</span>
                    <span class="sub-label">天上 (完美)</span>
                </div>
                <div class="side">
                    <span class="emoji">🕳️</span>
                    <span class="label">Gemini CLI</span>
                    <span class="sub-label">地下 (粗糙)</span>
                </div>
            </div>

            <div class="footer">
                <p style="font-size: 13px; color: #666; margin-bottom: 15px;">拥有 Google AI Pro 订阅？</p>
                <a href="#" class="cta-btn">欢迎测试讨论 💬</a>
            </div>
        </div>
    </div>

</body>
</html>
